services:
  - type: web
    name: gemini-chatbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: BACKEND_PORT
        value: "8000"
      - key: BACKEND_HOST
        value: "127.0.0.1"
